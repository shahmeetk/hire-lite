[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hire-lite"
version = "0.1.1"
description = "Lean, traceable, email-first agentic job-apply pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meet Shah" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/shahmeetk/hire-lite"

[project.scripts]
hl = "hire_lite.cli:main"

[tool.setuptools.packages.find]
include = ["hire_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
