name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        deps: ["full"]
        include:
          - python: "3.12"
            deps: "stdlib-only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "full" ]; then pip install -r requirements-dev.txt; else pip install pytest; fi
      - name: Tests
        run: python -m pytest -q
      - name: End-to-end dry run on synthetic examples
        run: bash scripts/demo.sh "$RUNNER_TEMP/demo"

  privacy:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PII scan (emails, phone numbers, home paths)
        run: python scripts/pii_scan.py
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
